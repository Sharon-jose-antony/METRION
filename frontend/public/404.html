<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>METRON - Redirecting...</title>
    <script>
      // Redirect direct GitHub Pages paths into HashRouter routes
      (function() {
        var pathSegmentsToKeep = 1; // /METRON/
        var l = window.location;
        var segments = l.pathname.split('/').filter(Boolean);
        var repoName = segments.length > 0 ? segments[0] : '';
        var remainingPath = segments.slice(pathSegmentsToKeep).join('/');
        var targetHash = '#/' + (remainingPath ? remainingPath : '');
        var newUrl = l.protocol + '//' + l.host + '/' + repoName + '/' + targetHash + l.search + (l.hash && !l.hash.startsWith('#/') ? l.hash : '');
        l.replace(newUrl);
      })();
    </script>
  </head>
  <body>
    <div style="font-family: sans-serif; text-align: center; padding: 50px;">
      <h2>Loading METRON Verification System...</h2>
      <p>Redirecting to statutory portal...</p>
    </div>
  </body>
</html>
