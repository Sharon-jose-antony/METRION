services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metrion_backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=metrion_production_secret_key_sih2026_demonstration
      - DATABASE_URL=sqlite:///./metrion.db
      - BASE_VERIFY_URL=http://localhost:3000/verify
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
    volumes:
      - backend_uploads:/app/uploads
      - backend_data:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/public/categories"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: metrion_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_uploads:
  backend_data:
